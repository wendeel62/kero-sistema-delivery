services:
  evolution_api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    environment:
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_API_KEY=kero_api_key_2026
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://kero:kero_pass@postgres:5432/evolution_v2?sslmode=disable
      - DEL_INSTANCE=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution_api
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://whatsapp-api:3000/webhook/evolution
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "8085:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - kero-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=kero
      - DB_POSTGRESDB_PASSWORD=kero_pass
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=kero_n8n_pass
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - kero-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - kero-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=kero
      - POSTGRES_PASSWORD=kero_pass
      - POSTGRES_MULTIPLE_DATABASES=evolution,n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - kero-network

  socketio:
    image: node:20-alpine
    container_name: socketio
    restart: always
    working_dir: /app
    command: sh -c "npm install socket.io socket.io-client pg redis && node index.js"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kero
      - DB_PASSWORD=kero_pass
      - DB_NAME=kero
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVO_API=http://evolution_api:8080
    volumes:
      - ./infra/socketio:/app
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - evolution_api
    networks:
      - kero-network

  whatsapp-api:
    image: node:20-alpine
    container_name: whatsapp-api
    restart: always
    working_dir: /app
    command: node whatsappApi.js
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kero
      - DB_PASSWORD=kero_pass
      - DB_NAME=kero
      - EVO_HOST=evolution_api
      - EVO_PORT=8080
      - EVO_API_KEY=kero_api_key_2026
      - SOCKET_URL=http://socketio:3001
    volumes:
      - ./server/src/whatsapp:/app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - socketio
      - evolution_api
    networks:
      - kero-network

  whatsapp-ui:
    image: node:20-alpine
    container_name: whatsapp-ui
    restart: always
    working_dir: /app
    command: sh -c "npm install express && node ui-server.js"
    volumes:
      - ./server/src/whatsapp:/app
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    networks:
      - kero-network

networks:
  kero-network:
    driver: bridge

volumes:
  n8n_data:
  postgres_data:
  evolution_instances:
