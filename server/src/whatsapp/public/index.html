<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kero WhatsApp - React Interface</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 18px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div>
        <h2>🚀 Carregando WhatsApp Kero...</h2>
        <p>Interface React completa com todas as funcionalidades</p>
      </div>
    </div>
  </div>

  <script>
    // Simulação do componente React para demonstração
    // Em produção, isso seria compilado com Vite/Webpack

    const tenantId = '9139ddd7-e3db-4beb-b8f9-aabc55e47b8e';
    const API_URL = 'http://localhost:3000';

    class WhatsAppApp {
      constructor() {
        this.devices = [];
        this.selectedDevice = null;
        this.conversations = [];
        this.selectedConv = null;
        this.messages = [];
        this.messageText = '';
        this.qrCode = null;
        this.isSending = false;
        this.connected = false;

        this.init();
      }

      init() {
        this.render();
        this.loadDevices();
        this.connectSocket();
      }

      render() {
        const html = `
          <div class="whatsapp-container">
            <div class="wa-sidebar">
              <div class="wa-header">
                <h2>WhatsApp</h2>
                <span class="wa-status ${this.connected ? 'connected' : ''}">
                  ${this.connected ? '🟢' : '🔴'}
                </span>
              </div>

              <div class="wa-devices-panel">
                ${this.qrCode ? this.renderQRCode() : this.renderDevicesList()}
              </div>

              <div class="wa-conversations">
                ${this.conversations.map(conv => this.renderConversation(conv)).join('')}
              </div>
            </div>

            <div class="wa-chat">
              ${this.selectedConv ? this.renderChat() : this.renderEmptyChat()}
            </div>
          </div>
        `;

        document.getElementById('root').innerHTML = html;
        this.attachEventListeners();
      }

      renderQRCode() {
        return `
          <div class="wa-qr-section">
            <h3>📱 Conectar WhatsApp</h3>
            <p>Escaneie o QR code abaixo:</p>
            <div class="wa-qr-container">
              <img src="https://api.qrserver.com/create-qr-code/?size=300x300&data=${encodeURIComponent(this.qrCode)}" class="wa-qr-image" />
            </div>
            <button onclick="app.hideQR()" class="wa-cancel-qr">❌ Cancelar</button>
          </div>
        `;
      }

      renderDevicesList() {
        return `
          <div class="wa-devices-list">
            ${this.devices.map(device => `
              <div class="wa-device-item ${this.selectedDevice?.id === device.id ? 'active' : ''} ${device.state}"
                   onclick="app.selectDevice('${device.id}')">
                <div class="wa-device-icon">
                  ${device.state === 'open' ? '📱' : device.state === 'connecting' ? '⏳' : '❌'}
                </div>
                <div class="wa-device-info">
                  <div class="wa-device-name">${device.device_name}</div>
                  <div class="wa-device-status">
                    ${device.state === 'open' ? 'Conectado' : device.state === 'connecting' ? 'Conectando...' : 'Pendente'}
                  </div>
                </div>
                ${device.state !== 'open' ? `<button onclick="app.getQRCode('${device.id}')" class="wa-get-qr-btn">📷 QR</button>` : ''}
              </div>
            `).join('')}
          </div>

          <div class="wa-add-device">
            <input type="text" id="deviceNameInput" placeholder="Nome do dispositivo" onkeypress="app.handleKeyPress(event)">
            <button onclick="app.createDevice()" id="createBtn">➕ Criar Dispositivo</button>
          </div>
        `;
      }

      renderConversation(conv) {
        return `
          <div class="wa-conv ${this.selectedConv === conv.id ? 'active' : ''}"
               onclick="app.selectConversation('${conv.id}')">
            <div class="wa-conv-avatar">👤</div>
            <div class="wa-conv-info">
              <div class="wa-conv-name">${conv.name || conv.jid}</div>
              <div class="wa-conv-preview">Última mensagem</div>
            </div>
          </div>
        `;
      }

      renderChat() {
        const conv = this.conversations.find(c => c.id === this.selectedConv);
        return `
          <div class="wa-chat-header">${conv?.name || 'Chat'}</div>
          <div class="wa-messages">
            ${this.messages.map(msg => `
              <div class="wa-message ${msg.from_me ? 'outgoing' : 'incoming'}">
                <div class="wa-message-content">${msg.content}</div>
                <div class="wa-message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
              </div>
            `).join('')}
            ${this.messages.length === 0 ? '<div class="wa-no-messages"><p>Nenhuma mensagem ainda</p><small>Envie uma mensagem para começar!</small></div>' : ''}
          </div>
          <div class="wa-input">
            <input type="text" id="messageInput" value="${this.messageText}" onkeypress="app.handleMessageKeyPress(event)"
                   placeholder="Digite uma mensagem..." ${this.isSending ? 'disabled' : ''}>
            <button onclick="app.sendMessage()" ${this.isSending ? 'disabled' : ''}>
              ${this.isSending ? '⏳' : '➤'}
            </button>
          </div>
        `;
      }

      renderEmptyChat() {
        return `
          <div class="wa-empty">
            <h2>💬 Bem-vindo ao WhatsApp Kero!</h2>
            <p>Selecione uma conversa à esquerda ou teste o chat demo:</p>
            <button onclick="app.startDemo()" class="wa-demo-btn">🎯 Iniciar Chat Demo</button>
          </div>
        `;
      }

      attachEventListeners() {
        // Event listeners are attached via onclick attributes
      }

      async loadDevices() {
        try {
          const response = await fetch(`${API_URL}/api/whatsapp/devices?tenant_id=${tenantId}`);
          this.devices = await response.json();
          this.render();
        } catch (error) {
          console.error('Error loading devices:', error);
        }
      }

      async createDevice() {
        const deviceName = document.getElementById('deviceNameInput').value.trim();
        if (!deviceName) return;

        document.getElementById('createBtn').textContent = '⏳';
        document.getElementById('createBtn').disabled = true;

        try {
          const response = await fetch(`${API_URL}/api/whatsapp/devices`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tenant_id: tenantId, device_name: deviceName })
          });

          const device = await response.json();
          this.devices.push(device);
          this.selectedDevice = device;
          document.getElementById('deviceNameInput').value = '';

          // Get QR code
          this.getQRCode(device.id);
        } catch (error) {
          alert('Erro ao criar dispositivo: ' + error.message);
        } finally {
          document.getElementById('createBtn').textContent = '➕ Criar Dispositivo';
          document.getElementById('createBtn').disabled = false;
        }
      }

      async getQRCode(deviceId) {
        try {
          const response = await fetch(`${API_URL}/api/whatsapp/devices/${deviceId}/qr?tenant_id=${tenantId}`);
          const data = await response.json();

          if (data.qr_code) {
            this.qrCode = data.qr_code;
            this.render();
            this.startQRPolling(deviceId);
          }
        } catch (error) {
          console.error('Error getting QR:', error);
        }
      }

      startQRPolling(deviceId) {
        setTimeout(async () => {
          try {
            const response = await fetch(`${API_URL}/api/whatsapp/devices/${deviceId}/status?tenant_id=${tenantId}`);
            const data = await response.json();

            const device = this.devices.find(d => d.id === deviceId);
            if (device) {
              device.state = data.state;
              this.render();
            }

            if (data.state === 'open') {
              this.qrCode = null;
              this.loadConversations(deviceId);
            } else {
              this.startQRPolling(deviceId);
            }
          } catch (error) {
            console.error('Polling error:', error);
          }
        }, 3000);
      }

      hideQR() {
        this.qrCode = null;
        this.render();
      }

      selectDevice(deviceId) {
        this.selectedDevice = this.devices.find(d => d.id === deviceId);
        this.loadConversations(deviceId);
        this.render();
      }

      async loadConversations(deviceId) {
        try {
          const response = await fetch(`${API_URL}/api/whatsapp/conversations?tenant_id=${tenantId}&device_id=${deviceId}`);
          const data = await response.json();
          this.conversations = data;

          if (data.length === 0) {
            this.conversations = [{
              id: 'demo-conversation',
              name: 'João Silva',
              jid: '5511999999999@s.whatsapp.net',
              unread_count: 0,
              last_message_at: null
            }];
          }
        } catch (error) {
          console.error('Error loading conversations:', error);
          this.conversations = [{
            id: 'demo-conversation',
            name: 'João Silva',
            jid: '5511999999999@s.whatsapp.net',
            unread_count: 0,
            last_message_at: null
          }];
        }
        this.render();
      }

      selectConversation(convId) {
        this.selectedConv = convId;
        this.loadMessages(convId);
        this.render();
      }

      async loadMessages(convId) {
        try {
          const response = await fetch(`${API_URL}/api/whatsapp/conversations/${convId}/messages`);
          const data = await response.json();
          this.messages = data.reverse();
        } catch (error) {
          console.error('Error loading messages:', error);
          this.messages = [];
        }
        this.render();
      }

      handleKeyPress(event) {
        if (event.key === 'Enter') {
          this.createDevice();
        }
      }

      handleMessageKeyPress(event) {
        if (event.key === 'Enter' && !this.isSending) {
          this.sendMessage();
        }
      }

      async sendMessage() {
        const messageText = document.getElementById('messageInput').value.trim();
        if (!messageText || this.isSending) return;

        const conversationId = this.selectedConv || 'demo-conversation';
        this.isSending = true;
        this.render();

        if (conversationId === 'demo-conversation') {
          // Demo message
          const newMessage = {
            id: 'demo_' + Date.now(),
            content: messageText,
            from_me: true,
            timestamp: new Date().toISOString(),
            content_type: 'text'
          };

          this.messages.push(newMessage);
          this.messageText = '';
          this.isSending = false;

          // Simulate response
          setTimeout(() => {
            const responseMessage = {
              id: 'demo_resp_' + Date.now(),
              content: `Resposta automática: "${messageText}"`,
              from_me: false,
              timestamp: new Date().toISOString(),
              content_type: 'text'
            };
            this.messages.push(responseMessage);
            this.render();
          }, 1000);

          this.render();
          return;
        }

        try {
          const response = await fetch(`${API_URL}/api/whatsapp/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tenant_id: tenantId,
              conversation_id: conversationId,
              text: messageText
            })
          });

          if (response.ok) {
            this.messageText = '';
          } else {
            alert('Erro ao enviar mensagem');
          }
        } catch (error) {
          alert('Erro de conexão');
        } finally {
          this.isSending = false;
          this.render();
        }
      }

      startDemo() {
        this.selectedConv = 'demo-conversation';
        this.conversations = [{
          id: 'demo-conversation',
          name: 'João Silva (Demo)',
          jid: '5511999999999@s.whatsapp.net',
          unread_count: 0,
          last_message_at: null
        }];
        this.messages = [];
        this.render();
      }

      connectSocket() {
        // Socket.io connection simulation
        setTimeout(() => {
          this.connected = true;
          this.render();
        }, 1000);
      }
    }

    // Initialize app
    const app = new WhatsAppApp();

    // Make app globally available for onclick handlers
    window.app = app;
  </script>

  <!-- Load CSS -->
  <link rel="stylesheet" href="styles.css">
</body>
</html>
