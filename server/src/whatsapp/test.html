<!DOCTYPE html>
<html>
<head>
  <title>Test Kero WhatsApp</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🧪 Teste Kero WhatsApp</h1>
  
  <div id="results"></div>
  
  <script>
    const results = document.getElementById('results');
    
    async function testAPI(name, url, options = {}) {
      try {
        const response = await fetch(url, options);
        const result = await response.text();
        results.innerHTML += `<div class="success">✅ ${name}: ${response.status} - ${result.substring(0, 100)}</div>`;
      } catch (error) {
        results.innerHTML += `<div class="error">❌ ${name}: ${error.message}</div>`;
      }
    }
    
    // Test all services
    setTimeout(() => {
      testAPI('WhatsApp API', 'http://localhost:3000/api/whatsapp/devices?tenant_id=9139ddd7-e3db-4beb-b8f9-aabc55e47b8e');
      testAPI('Socket.io', 'http://localhost:3001/socket.io/?EIO=4&transport=polling');
      testAPI('Evolution API', 'http://localhost:8085/', { headers: {'apikey': 'kero_api_key_2026'} });
      testAPI('UI Server', 'http://localhost:3002/dashboard');
    }, 1000);
  </script>
</body>
</html>
