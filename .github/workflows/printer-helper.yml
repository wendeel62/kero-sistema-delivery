name: Build Printer Helper

on:
  push:
    branches: [main, develop]
    paths:
      - 'printer-helper/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kero-Printer-Helper
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build (x64)
        working-directory: printer-helper
        run: go build -ldflags="-s -w" -o ../public/Kero-Printer-Helper-x64.exe .

      - name: Build (x86)
        working-directory: printer-helper
        run: |
          $env:GOARCH = "386"
          go build -ldflags="-s -w" -o ../public/Kero-Printer-Helper-x86.exe .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kero-Printer-Helper
          path: public/Kero-Printer-Helper-*.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/Kero-Printer-Helper-x64.exe
            public/Kero-Printer-Helper-x86.exe
